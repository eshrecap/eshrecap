  <!-- Text -->
  <text x="64" y="122" fill="#ffffff" font-size="40" font-weight="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Nur Rizka Sasi Kirana</text>
  <text x="64" y="164" fill="#f9c6e8" font-size="22" font-weight="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Frontend Dev  ·  Computer Science  ·  ML</text>

  <!-- Tech chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="198" width="92" height="34" rx="17" fill="#f590d5" fill-opacity="0.15" stroke="#f590d5" stroke-opacity="0.6"/>
    <text x="110" y="220" fill="#f9c6e8" text-anchor="middle">HTML</text>

    <rect x="168" y="198" width="104" height="34" rx="17" fill="#f590d5" fill-opacity="0.15" stroke="#f590d5" stroke-opacity="0.6"/>
    <text x="220" y="220" fill="#f9c6e8" text-anchor="middle">Tailwind</text>

    <rect x="284" y="198" width="104" height="34" rx="17" fill="#f590d5" fill-opacity="0.15" stroke="#f590d5" stroke-opacity="0.6"/>
    <text x="336" y="220" fill="#f9c6e8" text-anchor="middle">JavaScript</text>

    <rect x="400" y="198" width="92" height="34" rx="17" fill="#f590d5" fill-opacity="0.15" stroke="#f590d5" stroke-opacity="0.6"/>
    <text x="446" y="220" fill="#f9c6e8" text-anchor="middle">Python</text>
  </g>

  <!-- Butterfly -->
  <g transform="translate(725 150)">
    <!-- left wings -->
    <ellipse cx="-46" cy="-26" rx="50" ry="33" transform="rotate(25 -46 -26)" fill="#f590d5"/>
    <ellipse cx="-36" cy="32" rx="33" ry="23" transform="rotate(-25 -36 32)" fill="#d946a8"/>
    <ellipse cx="-46" cy="-26" rx="26" ry="16" transform="rotate(25 -46 -26)" fill="#ffffff" fill-opacity="0.25"/>
    <!-- right wings -->
