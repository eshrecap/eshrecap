    <ellipse cx="36" cy="32" rx="33" ry="23" transform="rotate(25 36 32)" fill="#d946a8"/>
    <ellipse cx="46" cy="-26" rx="26" ry="16" transform="rotate(-25 46 -26)" fill="#ffffff" fill-opacity="0.25"/>
    <!-- body -->
    <rect x="-5" y="-48" width="10" height="100" rx="5" fill="#630947"/>
    <!-- antennae -->
    <path d="M-2 -48 Q-14 -72 -26 -78" stroke="#f590d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 -48 Q14 -72 26 -78" stroke="#f590d5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-27" cy="-79" r="4" fill="#f590d5"/>
    <circle cx="27" cy="-79" r="4" fill="#f590d5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#f9c6e8">
    <path d="M820 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M640 220 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill-opacity="0.8"/>
    <path d="M800 225 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill-opacity="0.6"/>
