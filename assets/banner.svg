<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="300" fill="#0d1117"/>

  <!-- Card -->
  <rect x="30" y="30" width="840" height="240" rx="28" fill="#12161d" stroke="#f590d5" stroke-width="2"/>

  <!-- Accent bar -->
